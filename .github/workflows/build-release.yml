name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # 只改文档/README 时不触发构建；有源码变化才自动打包 release
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时需要创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 必须全量历史：versionCode 用 git 提交数自增，浅克隆会恒为 1
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install SDK packages
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;35.0.1"

      - name: Decode signing key (if provided)
        # secrets 上下文不能直接用于 if:，先转到 env 再判断
        if: ${{ env.HAS_SIGNING_KEY != '' }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$HAS_SIGNING_KEY" | base64 -d > /tmp/release-key.jks
          echo "KEYSTORE_PATH=/tmp/release-key.jks" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK (可直接安装)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-debug-installable
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        # 每次 push 到 main 都自动发布一个 CI 构建（prerelease）；打 v* tag 时发布正式版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.sha) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('CI Build {0}', github.sha) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          body: |
            ${{ github.ref_type == 'tag' && '正式发布' || '自动化 CI 构建' }} — commit `${{ github.sha }}`

            ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
