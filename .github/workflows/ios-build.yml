name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build RefusePhone (iOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, iphoneos)
        id: build
        continue-on-error: true
        working-directory: ios
        run: |
          xcodebuild -version
          xcodegen version || true
          xcodebuild -project RefusePhone.xcodeproj -scheme RefusePhone \
            -configuration Debug -sdk iphoneos -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build.log 2>&1
          EC=$?
          echo "xcodebuild_exit=$EC" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -25 build.log | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Show build errors
        if: steps.build.outcome == 'failure'
        working-directory: ios
        run: |
          {
            echo '## xcodebuild errors'
            echo '```'
            grep -E "error:|BUILD FAILED|The following build commands failed" build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|BUILD FAILED" build.log | head -20
          test -s <(grep -E "error:|BUILD FAILED" build.log)


      - name: Package .app
        working-directory: ios
        run: |
          cd build/DerivedData/Build/Products/Debug-iphoneos
          zip -qr RefusePhone-unsigned.zip RefusePhone.app
          ls -lh RefusePhone-unsigned.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RefusePhone-unsigned
          path: ios/build/DerivedData/Build/Products/Debug-iphoneos/RefusePhone-unsigned.zip
