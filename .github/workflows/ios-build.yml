name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build RefusePhone (iOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (simulator, unsigned)
        working-directory: ios
        run: |
          set +e
          # iOS 18.5 SDK 禁止 ad-hoc 签名，且完全禁用签名会导致 ValidateEmbeddedBinary
          # 校验扩展失败；模拟器构建无需签名，用于 CI 编译验证（真机签名在本地 Xcode 完成）
          xcodebuild -project RefusePhone.xcodeproj -scheme RefusePhone \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build/DerivedData \
            build > build.log 2>&1
          EC=$?
          if [ $EC -ne 0 ]; then
            echo "::error::xcodebuild exit=$EC"
            grep -E "error:|BUILD FAILED|The following build commands failed|warning: " build.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
            tail -5 build.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $EC

      - name: Package .app
        working-directory: ios
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -qr RefusePhone-simulator.zip RefusePhone.app
          ls -lh RefusePhone-simulator.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RefusePhone-unsigned
          path: ios/build/DerivedData/Build/Products/Debug-iphonesimulator/RefusePhone-simulator.zip
