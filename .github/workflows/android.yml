name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建 Release AAB（需在 Secrets 配置签名密钥）'
        type: boolean
        default: false

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          sdkmanager "platforms;android-34" "build-tools;35.0.1"
          yes | sdkmanager --licenses > /dev/null

      - name: Decode local.properties (可选 API Key)
        if: ${{ env.LOCAL_PROPERTIES != '' }}
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: echo "$LOCAL_PROPERTIES" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    # 仅打 tag v* 或手动勾选 build_release 时触发；需要配置签名 Secrets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          sdkmanager "platforms;android-34" "build-tools;35.0.1"
          yes | sdkmanager --licenses > /dev/null

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > keystore.jks
          {
            echo "KEYSTORE_PATH=$PWD/keystore.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
